<!doctype html>
<html lang="zh-CN">

  <style>
    :root { color-scheme: light; --ink: #343c32; --paper: #f5f0df; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { max-width: 1440px; min-height: 100svh; margin: auto; padding: 32px 6vw 24px; display: flex; flex-direction: column; }
    header, footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    header { font-size: 12px; letter-spacing: .16em; padding-bottom: 20px; border-bottom: 1px solid #343c3226; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .seal { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid #bc4938; border-radius: 50%; color: #bc4938; font-family: serif; font-size: 19px; }
    .intro { text-align: center; margin: 44px 0 0; position: relative; z-index: 1; }
    .eyebrow { font-size: 10px; letter-spacing: .34em; color: #89846c; }
    h1 { margin: 13px 0; font-family: "STKaiti", "KaiTi", "Songti SC", serif; font-size: clamp(36px, 6vw, 68px); font-weight: 500; letter-spacing: .16em; }
    .subtitle { font-size: 13px; letter-spacing: .15em; color: #797b68; }
    .scene { flex: 1; display: grid; align-content: center; }
    svg { display: block; width: 100%; max-height: 650px; overflow: visible; }
    footer { border-top: 1px solid #343c3226; padding-top: 20px; font-size: 11px; color: #878774; letter-spacing: .08em; }
    .tag { border: 1px solid #9b9e8060; border-radius: 30px; padding: 8px 13px; color: #697253; }
    .rider { animation: bob 1.6s ease-in-out infinite; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 3s linear infinite; }
    .scarf { animation: flutter 1.6s ease-in-out infinite; transform-origin: 573px 260px; }
    .cloud { animation: drift 7s ease-in-out infinite alternate; }
    .cloud.far { animation-delay: -3s; }
    .wind { animation: breeze 2s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 50% { transform: translateY(-4px); } }
    @keyframes flutter { 50% { transform: rotate(4deg); } }
    @keyframes drift { to { transform: translateX(18px); } }
    @keyframes breeze { 50% { opacity: .25; transform: translateX(-10px); } }
    @media (max-width: 600px) { main { padding: 22px 5vw; } header { font-size: 9px; } .intro { margin-top: 48px; } .scene { margin: 24px -4vw; overflow: hidden; } svg { width: 150%; max-width: none; margin-left: -25%; } footer { font-size: 9px; } .subtitle { font-size: 11px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
